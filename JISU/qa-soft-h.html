<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>POSCO-M QA view (temp)</title>
<style>
  html,body{margin:0;padding:0;background:#0b1220;overflow:hidden}
  iframe{border:0;display:block;background:#000}
</style>
</head>
<body>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var w=parseInt(p.get('w')||'1280',10), h=parseInt(p.get('h')||'800',10);
  var extra=p.get('q')||'';
  var f=document.createElement('iframe');
  f.id='F'; f.width=w; f.height=h; f.src='./qa-soft.html'+(extra?'?'+extra:'');
  document.body.appendChild(f);
})();
</script>
</body>
</html>
