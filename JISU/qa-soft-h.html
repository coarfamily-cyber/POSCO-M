<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>POSCO-M QA view (temp)</title>
<style>
  html,body{margin:0;padding:0;background:#0b1220;overflow:hidden}
  iframe{border:0;display:block;background:#000}
</style>
</head>
<body>
<iframe id="F" width="10" height="10" src="about:blank"></iframe>
<script>
window.__set = function(w,h,q,reload){
  var f=document.getElementById('F');
  f.width=w; f.height=h;
  var src='./qa-soft.html'+(q?('?'+q):'');
  if(reload){ src += (src.indexOf('?')<0?'?':'&') + 'r=' + Date.now(); f.src=src; }
  f.style.width=w+'px'; f.style.height=h+'px';
  return src;
};
window.__W = function(){ return document.getElementById('F').contentWindow; };
window.__D = function(){ return document.getElementById('F').contentDocument; };
</script>
</body>
</html>
