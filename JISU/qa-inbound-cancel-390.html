<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA 하네스</title>
<style>html,body{margin:0;background:#111;font-family:sans-serif}iframe{border:0;display:block;margin:0;background:#000}</style>
</head><body>
<iframe id="qa" width="390" height="844" src="./qa-inbound-cancel.html?zone=inbound"></iframe>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('qa');
  var w = q.get('w'), h = q.get('h'), zone = q.get('zone');
  if (w) f.setAttribute('width', w);
  if (h) f.setAttribute('height', h);
  if (zone !== null) {
    f.src = './qa-inbound-cancel.html' + (zone === '1' ? '?zone=inbound' : '');
  }
  f.setAttribute('width', f.getAttribute('width').replace('px',''));
})();
</script>
</body></html>
