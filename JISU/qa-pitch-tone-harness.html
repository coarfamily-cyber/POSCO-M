<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>피치 QA 하네스 (임시)</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font:12px/1.4 system-ui,sans-serif}
.row{display:flex;gap:14px;padding:10px;align-items:flex-start}
figure{margin:0}figcaption{font-weight:700;padding:4px 0;color:#93c5fd}
iframe{display:block;background:#111;border:1px solid #334155}
pre{white-space:pre-wrap;padding:10px;background:#0f172a;margin:0 10px 10px;font-size:11px;max-height:260px;overflow:auto}</style></head>
<body>
<div class="row">
  <figure><figcaption>모바일 390x844 · 피치 자세히보기</figcaption><iframe id="f390" src="qa-pitch-tone-4b7c2e.html" width="390" height="844"></iframe></figure>
  <figure><figcaption>모바일 412x915 · 피치 자세히보기</figcaption><iframe id="f412" src="qa-pitch-tone-4b7c2e.html" width="412" height="915"></iframe></figure>
</div>
<pre id="out">running...</pre>
<script>
const out=document.getElementById('out');
const lines=[];
function rec(s){lines.push(s);out.textContent=lines.join('\n');}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(id){
  const f=document.getElementById(id), w=f.contentWindow, d=f.contentDocument;
  for(let i=0;i<120;i++){ if(d && d.readyState==='complete' && d.querySelector('.hotspot-pill[data-toggle-zone="pitch"]')) break; await sleep(150); }
  const pill=d.querySelector('.hotspot-pill[data-toggle-zone="pitch"]');
  if(!pill){ rec(id+': pitch pill 없음'); return; }
  pill.click();
  for(let i=0;i<60;i++){ if(d.querySelector('#hotspot-pitch.is-open, #hotspot-pitch .expand-card') ) break; await sleep(150); }
  await sleep(700);
  const cs=(sel,prop)=>{const e=d.querySelector(sel);return e?w.getComputedStyle(e)[prop]:'없음';};
  rec(id+' viewport '+w.innerWidth+'x'+w.innerHeight);
  rec(id+' card open = '+d.querySelector('#hotspot-pitch').className);
  rec(id+' pitch-log bg='+cs('#pitchLog','backgroundColor')+' color='+cs('#pitchLog','color'));
  rec(id+' section title='+cs('#pitchLog .pitch-section-title','color'));
  rec(id+' input bg='+cs('#pitchLog .pitch-input','backgroundColor')+' color='+cs('#pitchLog .pitch-input','color'));
  rec(id+' add btn bg='+cs('#pitchLog .pitch-add','backgroundColor')+' color='+cs('#pitchLog .pitch-add','color'));
  rec(id+' work btn bg='+cs('#pitchLog .pitch-work-btn','backgroundColor')+' color='+cs('#pitchLog .pitch-work-btn','color'));
  rec(id+' date color='+cs('#pitchDate','color'));
  rec(id+' BAG label color='+cs('#pitchLog .pitch-num-wrap b','color'));
  const inks=[...d.querySelectorAll('#pitchLog input,#pitchLog button')];
  rec(id+' inputs/buttons='+inks.length);
  rec(id+' JS errors='+JSON.stringify((w.__qaErrors||[]).slice(0,6)));
  // 입고 카드와 비교용 값
  const inb=d.querySelector('#inboundLog');
  if(inb){ const c=w.getComputedStyle(inb); rec(id+' inbound-log bg='+c.backgroundColor+' color='+c.color); }
  const ip=d.querySelector('#inboundLog .inbound-tbl input');
  if(ip){ const c=w.getComputedStyle(ip); rec(id+' inbound input bg='+c.backgroundColor+' color='+c.color); }
  const card=d.querySelector('#hotspot-pitch > .expand-card').getBoundingClientRect();
  rec(id+' card rect='+[Math.round(card.x),Math.round(card.y),Math.round(card.width),Math.round(card.height)].join(','));
}
(async()=>{ try{ await run('f390'); await run('f412'); }catch(e){ rec('ERR '+e); } finally { rec('done'); } })();
</script>
</body></html>
