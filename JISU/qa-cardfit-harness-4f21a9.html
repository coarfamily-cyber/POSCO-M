<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>QA · 자세히보기 카드 크기 측정</title>
<style>html,body{margin:0;background:#0b1220;color:#dbeafe;font:12px/1.45 ui-monospace,monospace}pre{white-space:pre-wrap;padding:10px;margin:0}iframe{border:0;display:block}</style>
</head><body>
<pre id="out" style="position:absolute;left:0;top:3700px;width:1900px">running…</pre>
<script>
const SRC='qa-cardfit-4f21a9.html';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mk(w,h,id,top,q){
  const f=document.createElement('iframe');
  f.id=id; f.width=w; f.height=h;
  f.style.cssText='position:absolute;left:0;top:'+top+'px;width:'+w+'px;height:'+h+'px;border:0;background:#080b11';
  f.src=SRC+'?cb='+Date.now()+(q||'');
  document.body.appendChild(f);
  return new Promise(res=>{ f.onload=()=>setTimeout(res,2400); setTimeout(res,15000); });
}
function rect(card){ const r=card.getBoundingClientRect(); return {w:Math.round(r.width),h:Math.round(r.height),top:Math.round(r.top),left:Math.round(r.left),right:Math.round(r.right),bottom:Math.round(r.bottom)}; }
async function measure(f,label,scrollMode){
  const w=f.contentWindow, d=f.contentDocument;
  const res={label:label,vw:w.innerWidth,vh:w.innerHeight,docH:d.documentElement.scrollHeight,zones:[],errors:(w.__qaErrors||[]).slice()};
  const wrappers=[...d.querySelectorAll('.map-stage .hotspot-wrapper')].filter(x=>x.querySelector(':scope > .expand-card'));
  for(const wr of wrappers){
    d.querySelectorAll('.hotspot-wrapper.is-open').forEach(o=>{ if(o!==wr) o.classList.remove('is-open'); });
    if(scrollMode==='bottom'){ w.scrollTo(0, d.documentElement.scrollHeight); await sleep(80); }
    wr.classList.add('is-open');
    await sleep(200);
    const card=wr.querySelector(':scope > .expand-card');
    const r=rect(card);
    const cs=w.getComputedStyle(card);
    const item={id:wr.id.replace('hotspot-',''),...r,pos:cs.position,
      overflowX:(r.left<-0.5||r.right>res.vw+0.5), overflowY:(r.top<-0.5||r.bottom>res.vh+0.5),
      scrollable:card.scrollHeight>card.clientHeight+1};
    if(scrollMode==='bottom'){ w.scrollBy(0,-200); await sleep(200); const r2=rect(card); item.afterScroll={top:r2.top,bottom:r2.bottom,left:r2.left,right:r2.right}; w.scrollTo(0,d.documentElement.scrollHeight); await sleep(80); }
    res.zones.push(item);
  }
  d.querySelectorAll('.hotspot-wrapper.is-open').forEach(o=>o.classList.remove('is-open'));
  return res;
}
async function worker(f){
  const w=f.contentWindow, d=f.contentDocument;
  const wr=d.querySelector('#hotspot-inbound');
  const card=wr?wr.querySelector(':scope > .expand-card'):null;
  if(!card) return {label:'worker-zone-inbound',err:'no card'};
  card.scrollIntoView();
  await sleep(250);
  const cs=w.getComputedStyle(card);
  return Object.assign({label:'worker-zone-inbound',vw:w.innerWidth,vh:w.innerHeight,pos:cs.position,cssW:cs.width,cssH:cs.height,maxH:cs.maxHeight}, rect(card));
}
(async()=>{
  const out={};
  await mk(1919,992,'fdesk',0,'');
  await mk(390,844,'fmob',1000,'');
  await mk(899,800,'ftab',1900,'');
  await mk(390,844,'fwkr',2800,'&zone=inbound');
  out.desktop = await measure(document.getElementById('fdesk'),'desktop-1919x992','none');
  out.mobile  = await measure(document.getElementById('fmob'),'mobile-390x844','bottom');
  out.tablet  = await measure(document.getElementById('ftab'),'tablet-899x800','none');
  out.worker  = await worker(document.getElementById('fwkr'));
  window.__QA_RESULT = out;
  document.getElementById('out').textContent = JSON.stringify(out,null,1);
})();
</script>
</body></html>
