<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>POSCO-M QA 하네스(임시)</title>
<style>html,body{margin:0;background:#0b1220;color:#e2e8f0;font:12px/1.45 -apple-system,system-ui,sans-serif}
#stage{position:relative;height:1500px}
#bar{position:sticky;top:0;z-index:5;background:#0f172a;border-bottom:1px solid #334155;padding:6px 10px;font-weight:800}
pre{white-space:pre-wrap;padding:10px;background:#0f172a;margin:0;font-size:11px;max-height:900px;overflow:auto}</style></head>
<body><div id="bar">POSCO-M QA · <span id="summary">-</span></div><div id="stage"></div><pre id="out">running...</pre>
<script>
const Q = "qa-e2e-91b7c4.html";
const KSTD = d => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d||new Date());
const TODAY = KSTD();
const addDay = (k,n) => KSTD(new Date(Date.parse(k+'T12:00:00+09:00') + n*864e5));
const D1 = addDay(TODAY,1), D2 = addDay(TODAY,2);
const R = {checks:[], log:[], data:{}};
function rec(n,pass,d){ R.checks.push({n:n,p:!!pass,d:d===undefined?'':String(d).slice(0,700)}); paint(); }
function note(s){ R.log.push(String(s).slice(0,500)); paint(); }
function paint(){
  const fail = R.checks.filter(c=>!c.p).length;
  document.getElementById('out').textContent =
    'TODAY ' + TODAY + '  checks ' + R.checks.length + '  fail ' + fail + '\n' +
    R.checks.map(c=>(c.p?'PASS ':'FAIL ')+c.n+(c.d?' :: '+c.d:'')).join('\n') + '\n---- notes\n' + R.log.join('\n');
  document.getElementById('summary').textContent = R.checks.length + ' / fail ' + fail;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function frame(id){ return document.getElementById(id); }
function W(id){ return frame(id).contentWindow; }
function D(id){ return frame(id).contentDocument; }
async function ready(id, ms){
  const limit = ms||20000, t0 = Date.now();
  while(Date.now()-t0 < limit){
    const d = D(id);
    if(d && d.readyState==='complete' && d.querySelector('.hotspot-pill')) { await sleep(600); return true; }
    await sleep(150);
  }
  return false;
}
function addFrame(id, w, h, url, scale, x, y){
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:'+x+'px;top:'+y+'px;width:'+Math.round(w*scale)+'px;height:'+Math.round(h*scale)+'px;overflow:hidden;outline:1px solid #334155';
  const f = document.createElement('iframe');
  f.id=id; f.width=w; f.height=h; f.src=url;
  f.style.cssText='transform-origin:0 0;transform:scale('+scale+');border:0;display:block';
  box.appendChild(f); document.getElementById('stage').appendChild(box); return f;
}
function ev(id, code){ try{ return W(id).eval(code); }catch(e){ note('eval error '+id+': '+(e&&e.message)); return 'EVALERR:'+(e&&e.message); } }
function errs(id){ try{ return (W(id).__qaErrors||[]).slice(0,12); }catch(e){ return ['n/a']; } }

/* ---------- 화면 검사 (한 프레임) ---------- */
async function uiCheck(id, label){
  const ok = await ready(id);
  rec(label+' 프레임 로드', ok, ok?'':'ready timeout');
  if(!ok) return;
  const d = D(id), w = W(id);
  rec(label+' 뷰포트', true, w.innerWidth+'x'+w.innerHeight);
  const zones = ev(id, "Array.from(document.querySelectorAll('.hotspot-pill[data-toggle-zone]')).map(b=>b.getAttribute('data-toggle-zone'))") || [];
  rec(label+' 구역 버튼 수', zones.length === 14, zones.length + '개: ' + zones.join(','));
  const rows = [];
  for(const z of zones){
    ev(id, "(function(){var b=document.querySelector('.hotspot-pill[data-toggle-zone=\""+z+"\"]'); if(b) b.click();})()");
    await sleep(340);
    const r = ev(id, "(function(){var b=document.querySelector('.hotspot-pill[data-toggle-zone=\""+z+"\"]'); if(!b) return JSON.stringify({miss:1}); var wr=b.closest('.hotspot-wrapper'); var card=wr&&wr.querySelector(':scope > .expand-card'); if(!card) return JSON.stringify({nocard:1}); var r=card.getBoundingClientRect(); var inside=(r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1); var glass=getComputedStyle(card).backgroundColor; var open=wr.classList.contains('is-open'); return JSON.stringify({w:Math.round(r.width),h:Math.round(r.height),l:Math.round(r.left),t:Math.round(r.top),inside:inside,open:open,glass:glass});})()");
    let o={}; try{ o=JSON.parse(r); }catch(e){ o={raw:r}; }
    rows.push(z+' '+(o.w||'?')+'x'+(o.h||'?')+' @'+o.l+','+o.t+' inside='+o.inside+' open='+o.open);
    if(!o.inside || o.miss || o.nocard || o.open===false) rec(label+' 카드 '+z+' 화면 안', false, JSON.stringify(o));
    else rec(label+' 카드 '+z+' 화면 안', true, (o.w+'x'+o.h));
    const bg = o.glass||'';
    if(/rgba\(255, 255, 255/.test(bg)===false) rec(label+' 카드 '+z+' 밝은 유리 배경', false, bg);
    ev(id, "(function(){var b=document.querySelector('.hotspot-pill[data-toggle-zone=\""+z+"\"]'); var wr=b&&b.closest('.hotspot-wrapper'); var x=wr&&wr.querySelector('.mobile-card-close'); if(x) x.click(); else if(b) b.click(); if(wr) wr.classList.remove('is-open');})()");
    await sleep(160);
  }
  rec(label+' 카드 14개 열기/닫기', rows.length===14, rows.join(' | '));
  const leftOpen = ev(id, "document.querySelectorAll('.hotspot-wrapper.is-open').length");
  rec(label+' 닫은 뒤 열린 카드 0', leftOpen===0, 'is-open='+leftOpen);
  /* 달력 */
  ev(id, "document.getElementById('liveClock').click()"); await sleep(400);
  rec(label+' 달력 열림', ev(id, "!document.getElementById('calModal').hidden"), '');
  rec(label+' 달력 칸 수', true, ev(id, "document.querySelectorAll('#calGrid .cal-cell[data-day]').length"));
  ev(id, "document.getElementById('calClose').click()"); await sleep(200);
  /* 실적 */
  ev(id, "document.getElementById('perfBtn').click()"); await sleep(500);
  rec(label+' 실적 창 열림', ev(id, "!document.getElementById('perfModal').hidden"), ev(id, "(document.getElementById('pfRange')||{}).textContent"));
  ev(id, "document.getElementById('pfClose').click()"); await sleep(150);
  /* 검색 */
  ev(id, "(function(){var i=document.getElementById('hdrSearchInput'); i.value='2동'; i.dispatchEvent(new Event('input',{bubbles:true}));})()");
  await sleep(700);
  const hits = ev(id, "document.querySelectorAll('#hdrSearchPanel button').length");
  rec(label+' 검색 결과', hits>0, hits+'건');
  const opened = ev(id, "(function(){var all=Array.from(document.querySelectorAll('#hdrSearchPanel button')); var b=all.find(x=>/건물 상세|건물$/.test(x.textContent))||all.find(x=>/건물/.test(x.textContent)); if(!b) return 'noitem'; b.click(); return 'clicked';})()");
  await sleep(500);
  if(opened==='clicked'){
    rec(label+' 검색→상세 창', ev(id, "(function(){var m=document.getElementById('detailModal'); if(!m) return 'n/a'; return !m.hidden && getComputedStyle(m).display!=='none';})()"), '');
    ev(id, "(function(){var b=document.getElementById('closeModalX')||document.getElementById('closeModalBtn'); if(b) b.click();})()");
    await sleep(200);
  } else rec(label+' 검색→상세 창', true, '검색 결과에 건물 항목 없음(구역 항목만) — 생략');
  ev(id, "(function(){var c=document.getElementById('hdrSearchClear'); if(c) c.click();})()");
  rec(label+' JS 오류', errs(id).length===0, JSON.stringify(errs(id)));
}

/* ---------- 시드 ---------- */
const Y1 = addDay(TODAY,-1);
function seedAll(){
  const cmds = [
    {id:'c1',target:'outbound',kind:'instruction',text:'RAS-2 33 TON',at:'11. 18. 08:10',day:Y1,completed:true,done:33,completedAt:'11. 18. 15:00',closed:true},
    {id:'c2',target:'inbound:SH',kind:'instruction',text:'SH 36 TON',at:'11. 18. 08:20',day:Y1,completed:true,short:true,done:30,completedAt:'11. 18. 16:10',closed:true},
    {id:'c3',target:'inbound:16kg 파렛트',kind:'instruction',text:'16 KG 파렛트 2대',at:'11. 19. 08:30',day:TODAY,completed:true,done:2,completedAt:'11. 19. 09:00'},
    {id:'c4',target:'production-a',kind:'instruction',text:'생산A 12 TON',at:'11. 19. 09:00',day:TODAY,working:true},
    {id:'c5',target:'*',kind:'notice',text:'바닥 공사 안내',at:'11. 19. 09:10',day:TODAY}
  ];
  const memos = [{id:'m1',target:'outbound',tag:'issue',text:'파렛트 파손 2건',at:'11. 19. 10:00',by:'김지수'}];
  const inb = {}; inb[TODAY] = {rows:[{lot:'L1',bag:'001',kg:'1000',worker:'김지수',loc:'서울12가3456'},{lot:'L1',bag:'002',kg:'1000.5',worker:'김지수'}], archivedRows:[{lot:'L0',bag:'A',kg:'500',worker:'김지수'}], workState:'done', completedAt:'11. 19. 15:00'};
  const pitch = {}; pitch[TODAY] = {grind1:'100',grind2:'50',workState:'done',add1s:['RPB12345678-999'],moves:[]};
  const ls = W('fD').localStorage;
  ls.setItem('jisu-commands-v1', JSON.stringify(cmds));
  ls.setItem('jisu-memos-v1', JSON.stringify(memos));
  ls.setItem('jisu-inbound-records-v1', JSON.stringify(inb));
  ls.setItem('jisu-pitch-records-v1', JSON.stringify(pitch));
  ls.setItem('jisu-env-v1', JSON.stringify({u:{'1,2':{s:'done',ts:'08:00',td:'08:20'}},round:1}));
  ls.setItem('jisu-env-log-v1', JSON.stringify([{day:TODAY,unit:'1,2',round:1,ts:'08:00',td:'08:20',by:'김지수'}]));
  ls.setItem('jisu-schedule-v1','[]');
  ls.setItem('jisu-photos-v1','[]');
  ls.setItem('jisu-user','김지수');
  seedPhoto();
}
/* 출고 사진 시트 검증용 1x1 JPEG (실제 사진은 아님) */
const PHOTO_DATA = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAACf/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AKp//2Q==';
function seedPhoto(){
  try{
    const req = W('fD').indexedDB.open('jisu-photos',1);
    req.onupgradeneeded = () => { const db=req.result; if(!db.objectStoreNames.contains('outbound')) db.createObjectStore('outbound',{keyPath:'id'}); };
    req.onsuccess = () => { const db=req.result; try{
      const tx=db.transaction('outbound','readwrite');
      tx.objectStore('outbound').put({id:'QAphoto1', day:TODAY, at:'11. 19. 10:30', name:'QA_출고사진.jpg', data:PHOTO_DATA});
      tx.oncomplete=()=>db.close();
    }catch(e){ db.close(); } };
  }catch(e){}
}
async function resetState(){
  seedAll();
  ev('fD', "location.reload()");
  await sleep(1200);
  return ready('fD');
}
function sch(){ try{ return JSON.parse(W('fD').localStorage.getItem('jisu-schedule-v1')||'[]'); }catch(e){ return null; } }
function cmds(){ try{ return JSON.parse(W('fD').localStorage.getItem('jisu-commands-v1')||'[]'); }catch(e){ return null; } }
function openBatch(){
  ev('fD', "(function(){ if(document.getElementById('calModal').hidden) document.getElementById('liveClock').click(); })()");
  ev('fD', "(function(){ var b=document.getElementById('calBatchBtn'); if(b) b.click(); })()");
}
async function doBatch(text, target, lock){
  openBatch(); await sleep(300);
  ev('fD', "(function(){var s=document.getElementById('czBatchTarget'); s.value="+JSON.stringify(target)+"; s.dispatchEvent(new Event('change',{bubbles:true})); var l=document.getElementById('czBatchLockTarget'); l.checked="+(lock?'true':'false')+"; l.dispatchEvent(new Event('change',{bubbles:true})); var t=document.getElementById('czBatchText'); t.value="+JSON.stringify(text)+"; t.dispatchEvent(new Event('input',{bubbles:true}));})()");
  await sleep(400);
  const preview = ev('fD', "document.getElementById('czBatchPreview').innerText");
  const badge = ev('fD', "document.getElementById('czBatchCountBadge').textContent");
  const disabled = ev('fD', "document.getElementById('czBatchSaveBtn').disabled");
  ev('fD', "document.getElementById('czBatchSaveBtn').click()");
  await sleep(800);
  return {preview:preview, badge:badge, disabled:disabled, sch:sch(), cmds:cmds()};
}
function summarize(arr){
  return (arr||[]).map(x=>x.date+'|'+x.target+'|'+x.kind+'|'+x.text+(x.applied?'|applied':'')).join('\n');
}

async function runFunctional(){
  await resetState();
  const base = JSON.stringify(cmds()||[]);
  /* ---------- A: 여러 날짜 + 공지 ---------- */
  const txtA = [
    '주임님 금주 소모품 입고 내역 공유드립니다.',
    '',
    (Number(TODAY.slice(5,7)))+'월 '+(Number(TODAY.slice(8,10)))+'일',
    '사각박스 640 EA',
    '알루미늄 파우치백 600 EA',
    '',
    (Number(D1.slice(5,7)))+'월 '+(Number(D1.slice(8,10)))+'일',
    '16 KG 파렛트 576 EA',
    '공지 내일 오전 9시 안전교육 있습니다',
    '',
    (Number(D2.slice(5,7)))+'월 '+(Number(D2.slice(8,10)))+'일',
    '! 사각박스 320 EA 급히',
    '',
    '입니다.'
  ].join('\n');
  let r = await doBatch(txtA, 'inbound', false);
  R.data.A = {preview:r.preview, badge:r.badge, sch:summarize(r.sch)};
  rec('A 미리보기 3일 묶음', /3일|일\s*\(/.test(r.preview) && r.badge==='5건', 'badge='+r.badge);
  rec('A 저장 건수 5', (r.sch||[]).length===5, 'sch='+(r.sch||[]).length);
  rec('A 날짜 3개 분배', new Set((r.sch||[]).map(x=>x.date)).size===3, summarize(r.sch));
  rec('A 파렛트 환산', (r.sch||[]).some(x=>/16 KG 파렛트 2대/.test(x.text)), JSON.stringify((r.sch||[]).map(x=>x.text)));
  rec('A 공지 전체(*) 지정', (r.sch||[]).some(x=>x.kind==='notice'&&x.target==='*'), JSON.stringify((r.sch||[]).filter(x=>x.kind==='notice')));
  rec('A 긴급 표시', (r.sch||[]).some(x=>x.urgent===true), '');
  rec('A 빈 줄·인사말 무시', !(r.sch||[]).some(x=>/주임님|입니다/.test(x.text)), '');

  /* ---------- A2: 고정 등록 ON ---------- */
  await resetState();
  r = await doBatch(txtA.replace('사각박스 640 EA','출고 RAS-2 10 TON'), 'packaging', true);
  R.data.A2 = {sch:summarize(r.sch)};
  rec('A2 고정 등록 시 대상 고정', (r.sch||[]).every(x=>x.target==='packaging'||x.kind==='notice'), summarize(r.sch));

  /* ---------- B: 2공장 배차 표 ---------- */
  await resetState();
  const txtB = [
    ['상차일','출차시간','공장','품목','중량','파렛트','하차지','차량번호','차종','수량'].join('\t'),
    [D1,'08:00','2공장','RAS-2','16KG','960P','세종','서울12가3456','윙바디','16 KG / 960 P'].join('\t'),
    [D1,'10:00','1공장','L1','10 T','','포항','부산34나5678','카고','10 TON'].join('\t'),
    [D2,'13:00','2공장','CP3K','5T','','세종','대구56다7890','카고','5 TON'].join('\t')
  ].join('\n');
  r = await doBatch(txtB, 'inbound', false);
  R.data.B = {preview:r.preview, sch:summarize(r.sch)};
  rec('B 2공장 2건만 출고 라우팅', (r.sch||[]).length===2 && (r.sch||[]).every(x=>x.target==='outbound'), summarize(r.sch));
  rec('B 차량번호 포함', (r.sch||[]).every(x=>/서울12가3456|대구56다7890/.test(x.text)), JSON.stringify((r.sch||[]).map(x=>x.text)));
  rec('B 1공장 제외', !(r.sch||[]).some(x=>/부산34나5678/.test(x.text)), '');
  rec('B 날짜 2개', new Set((r.sch||[]).map(x=>x.date)).size===2, JSON.stringify((r.sch||[]).map(x=>x.date)));

  /* ---------- C: 오전/오후 혼합 ---------- */
  await resetState();
  r = await doBatch('오전 SH 36 TON, 오후 HH 36 TON', 'inbound', false);
  R.data.C = {sch:summarize(r.sch)};
  rec('C 오전/오후 2건 분리', (r.sch||[]).length===2 && (r.sch||[]).some(x=>/^오전 SH 36 TON$/.test(x.text)) && (r.sch||[]).some(x=>/^오후 HH 36 TON$/.test(x.text)), summarize(r.sch));
  await resetState();
  r = await doBatch('오전 10시~12시 설비 점검', 'inbound', false);
  R.data.C2 = {sch:summarize(r.sch)};
  rec('C2 시간 표기는 분리 안 함', (r.sch||[]).length===1, summarize(r.sch));

  /* ---------- D: 파렛트 288 환산 ---------- */
  await resetState();
  r = await doBatch('파렛트 576 EA\n파렛트 288개\n알루미늄 파우치백 600 EA', 'inbound', false);
  R.data.D = {sch:summarize(r.sch)};
  const dtxt = (r.sch||[]).map(x=>x.text).join(' || ');
  rec('D 576→2대 · 288→1대', /파렛트 2대/.test(dtxt) && /파렛트 1대/.test(dtxt), dtxt);
  rec('D 비파렛트 600 EA 유지', /알루미늄 파우치백 600 EA/.test(dtxt), dtxt);

  /* ---------- E: 공지 강제 전체 ---------- */
  await resetState();
  r = await doBatch('공지 출고 바닥 공사', 'outbound', false);
  R.data.E = {sch:summarize(r.sch)};
  rec('E 공지는 대상 무관 전체(*)', (r.sch||[]).length===1 && r.sch[0].target==='*' && r.sch[0].kind==='notice', summarize(r.sch));

  /* ---------- F: 달력 날짜별 오전/오후 저장 ---------- */
  await resetState();
  const days = [TODAY, D1, D2];
  const saved = [];
  for(const day of days){
    ev('fD', "window.jisuCalOpenDay('"+day+"')"); await sleep(250);
    ev('fD', "(function(){var t=document.getElementById('czText'); t.value='입고 오전 SH 36 TON\\n입고 오후 HH 36 TON'; t.dispatchEvent(new Event('input',{bubbles:true}));})()");
    ev('fD', "document.getElementById('czSave').click()"); await sleep(500);
    const items = (sch()||[]).filter(x=>x.date===day);
    saved.push(day+': '+items.map(x=>x.text).join(' / '));
    rec('F '+day+' 오전/오후 2건', items.length===2 && items.some(x=>x.text==='오전 SH 36 TON') && items.some(x=>x.text==='오후 HH 36 TON'), items.map(x=>x.text).join(' / '));
    const listN = ev('fD', "document.querySelectorAll('#czList .cz-item').length");
    rec('F '+day+' 목록 표시 2줄', listN===2, 'czList='+listN);
  }
  R.data.F = {saved:saved, sch:summarize(sch())};
  /* 삭제·수정 */
  ev('fD', "(function(){var t=document.getElementById('czText'); t.value=''; window.confirm=function(){return true;};})()");
  ev('fD', "window.jisuCalOpenDay('"+D1+"')"); await sleep(300);
  const delId = (sch().filter(x=>x.date===D1)[1]||{}).id;
  ev('fD', "(function(){var b=document.querySelector('[data-cz-del=\""+(delId||'')+"\"]'); if(b) b.click();})()");
  await sleep(500);
  rec('F 삭제 후 1건', (sch().filter(x=>x.date===D1)).length===1, JSON.stringify((sch().filter(x=>x.date===D1)).map(x=>x.text)));
  ev('fD', "window.jisuCalOpenDay('"+D2+"')"); await sleep(300);
  const editId = (sch().filter(x=>x.date===D2)[0]||{}).id;
  ev('fD', "(function(){var b=document.querySelector('[data-cz-edit=\""+editId+"\"]'); if(b) b.click();})()"); await sleep(250);
  ev('fD', "(function(){var i=document.querySelector('[data-cz-input=\""+editId+"\"]'); i.value='입고 사각박스 320 EA';})()");
  ev('fD', "(function(){var b=document.querySelector('[data-cz-ok=\""+editId+"\"]'); if(b) b.click();})()"); await sleep(350);
  rec('F 수정 반영', (sch().filter(x=>x.date===D2)[0]||{}).text==='사각박스 320 EA', JSON.stringify((sch().filter(x=>x.date===D2)).map(x=>x.text)));

  /* ---------- F2: 달력 한 줄 혼합 입력 ---------- */
  ev('fD', "window.jisuCalOpenDay('"+D2+"')"); await sleep(250);
  ev('fD', "(function(){var t=document.getElementById('czText'); t.value='출고 오전 RAS-2 20 TON, 오후 L1 20 TON'; t.dispatchEvent(new Event('input',{bubbles:true}));})()");
  ev('fD', "document.getElementById('czSave').click()"); await sleep(500);
  const d2items = (sch()||[]).filter(x=>x.date===D2 && x.target==='outbound');
  R.data.F2 = (sch()||[]).filter(x=>x.date===D2).map(x=>x.target+'|'+x.text);
  rec('F2 한 줄 오전/오후 분리 저장', d2items.length===2 && d2items.some(x=>/^오전 RAS-2 20 TON$/.test(x.text)) && d2items.some(x=>/^오후 L1 20 TON$/.test(x.text)), JSON.stringify(R.data.F2));

  /* ---------- G: 08시 적용(금일작업으로 이동) ---------- */
  ev('fD', "(function(){var s=JSON.parse(localStorage.getItem('jisu-schedule-v1')||'[]').filter(x=>x.date==='"+TODAY+"'); s.forEach(function(x){delete x.applied; delete x.appliedAt;}); var c=JSON.parse(localStorage.getItem('jisu-commands-v1')||'[]').filter(x=>!/^s/.test(x.id)); localStorage.setItem('jisu-commands-v1',JSON.stringify(c)); localStorage.setItem('jisu-schedule-v1',JSON.stringify(s));})()");
  ev('fD', "window.jisuApplySchedules(null,{immediateToday:true})"); await sleep(400);
  const todayCmds = (cmds()||[]).filter(x=>x.day===TODAY && /^s/.test(x.id));
  R.data.G = {cmds:todayCmds.map(x=>x.id+'|'+x.target+'|'+x.text).join('\n')};
  rec('G 금일작업 2건 분리 등록', todayCmds.length===2 && todayCmds.some(x=>x.text==='오전 SH 36 TON') && todayCmds.some(x=>x.text==='오후 HH 36 TON'), R.data.G.cmds);
  rec('G 서로 다른 작업 id', new Set(todayCmds.map(x=>x.id)).size===todayCmds.length, R.data.G.cmds);
  /* G2: 예약 1건에 오전/오후가 함께 있는 경우 → 적용 시 s·s-1 두 카드 */
  ev('fD', "(function(){var s=JSON.parse(localStorage.getItem('jisu-schedule-v1')||'[]'); s.push({id:'QAJOIN1',date:'"+TODAY+"',target:'pitch',kind:'instruction',text:'오전 CP3K 5 TON 오후 C3B 5 TON',created:'11. 19. 00:30'}); s.forEach(function(x){delete x.applied;}); var c=JSON.parse(localStorage.getItem('jisu-commands-v1')||'[]').filter(function(x){return x.id.indexOf('sQAJOIN1')!==0;}); localStorage.setItem('jisu-commands-v1',JSON.stringify(c)); localStorage.setItem('jisu-schedule-v1',JSON.stringify(s));})()");
  ev('fD', "window.jisuApplySchedules(null,{immediateToday:true})"); await sleep(400);
  const joinCmds = (cmds()||[]).filter(x=>/^sQAJOIN1/.test(x.id));
  R.data.G2 = joinCmds.map(x=>x.id+'|'+x.text);
  rec('G2 한 예약 → s·s-1 분리', joinCmds.length===2 && joinCmds.some(x=>x.id==='sQAJOIN1') && joinCmds.some(x=>x.id==='sQAJOIN1-1') && joinCmds.some(x=>x.text==='오전 CP3K 5 TON') && joinCmds.some(x=>x.text==='오후 C3B 5 TON'), JSON.stringify(R.data.G2));

  /* ---------- J: 분리된 작업 완료 토글 ---------- */
  const pmId = (todayCmds.find(x=>/오후 HH/.test(x.text||''))||{}).id;
  ev('fD', "(function(){var s=document.getElementById('cmdTarget'); s.value='inbound'; s.dispatchEvent(new Event('change',{bubbles:true}));})()");
  await sleep(400);
  ev('fD', "(function(){var b=document.querySelector('[data-cmd-complete=\""+(pmId||'')+"\"]'); if(b) b.click();})()");
  await sleep(500);
  const pmCmd = (cmds()||[]).find(x=>x.id===pmId)||{};
  R.data.J = JSON.stringify(pmCmd);
  rec('J 오후 작업만 완료 토글', pmCmd.completed===true && (pmCmd.done==null||pmCmd.done===''), R.data.J);
  const pmText = ev('fD', "(function(){var it=Array.from(document.querySelectorAll('.cmd-item')).find(function(e){return /오후 HH 36 TON/.test(e.textContent);}); return it?it.innerText.replace(/\\n/g,' | ').slice(0,120):'not-rendered';})()");
  rec('J 화면에 완료됨 표시', /완료됨|완료/.test(String(pmText)), String(pmText));
  const amCmd = (cmds()||[]).find(x=>x.id===(todayCmds.find(y=>/오전 HH/.test(y.text||''))||{}).id)||{};
  rec('J 오전 작업은 그대로', !amCmd.completed, JSON.stringify({id:amCmd.id,completed:amCmd.completed,done:amCmd.done}));

  /* ---------- H: 엑셀 ---------- */
  await resetState();
  ev('fD', "(function(){var s=JSON.parse(localStorage.getItem('jisu-schedule-v1')||'[]'); s.push({id:'QAUP1',date:'"+D2+"',target:'outbound',kind:'instruction',text:'예정 RAS-2 10 TON',created:'11. 19. 11:00'}); localStorage.setItem('jisu-schedule-v1',JSON.stringify(s));})()");
  const ex1 = await ev('fD', "(async function(){ try{ return JSON.stringify(await window.jisuExportWork({skipPrompt:true, filename:'QA_금일작업'})); }catch(e){ return 'ERR:'+e.message; } })()");
  R.data.excel = ex1;
  rec('H 엑셀 생성', /xlsx/.test(String(ex1)), String(ex1));
  const ex2 = await ev('fD', "(async function(){ try{ return JSON.stringify(await window.jisuInboundArchive.exportExcel()); }catch(e){ return 'ERR:'+e.message; } })()");
  R.data.excelInbound = ex2;
  rec('H 입고 엑셀 생성', /true/.test(String(ex2)), String(ex2));

  /* ---------- I: 실적(주간/월간) + PPT ---------- */
  ev('fD', "window.jisuPerfOpen()"); await sleep(700);
  const wk = ev('fD', "document.getElementById('pfSlide').innerText");
  R.data.week = wk;
  rec('I 주간 실적 렌더', /전체 완료율/.test(wk||'') && /출고|입고/.test(wk||''), (wk||'').slice(0,120));
  rec('I 내부 키 노출 없음', !/outbound:|inbound:|production-a/.test(wk||''), '');
  rec('I 주간 수치(어제 마감 65.5/69 TON)', (wk||'').indexOf('TON 65.5 / 69')>=0 && (wk||'').indexOf('100%')>=0, String((wk||'').match(/TON [^ ]+ \/ [0-9.]+/)||''));
  ev('fD', "(function(){var b=document.querySelector('[data-pf-mode=\"month\"]'); if(b) b.click();})()"); await sleep(600);
  const mo = ev('fD', "document.getElementById('pfSlide').innerText");
  R.data.month = mo;
  rec('I 월간 전환', /월|월간|이번 달/.test(ev('fD', "document.getElementById('pfRange').textContent")||''), ev('fD', "document.getElementById('pfRange').textContent"));
  rec('I 월간 실적 렌더', /전체 완료율/.test(mo||''), (mo||'').slice(0,120));
  ev('fD', "(function(){var b=document.querySelector('[data-pf-mode=\"week\"]'); if(b) b.click();})()"); await sleep(500);
  ev('fD', "document.getElementById('pfPptBtn').click()"); await sleep(1500);
  rec('I PPT 버튼 클릭', true, '다운로드 확인은 파일로 검증');
  rec('H/I JS 오류', errs('fD').length===0, JSON.stringify(errs('fD')));
}
