<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA frame — 달력 기록 칩</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e14;overflow:hidden}
  iframe{display:block;border:0;background:#0b0e14}
  #lbl{position:fixed;right:6px;bottom:4px;font:11px/1 monospace;color:#64748b}
</style>
</head>
<body>
<iframe id="f" src="qa-calchips.html"></iframe>
<div id="lbl"></div>
<script>
  var p = new URLSearchParams(location.search);
  var w = p.get('w') || '1440', h = p.get('h') || '900';
  var f = document.getElementById('f');
  f.src = 'qa-calchips.html?cb=' + Date.now();
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  document.getElementById('lbl').textContent = w + 'x' + h;
</script>
</body>
</html>
